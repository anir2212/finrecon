      - name: created_by
        description: "User who recorded the posting."
      - name: approved_by
        description: "User who approved the posting."
      - name: source_file
        description: "Absolute path of the ingested CSV."
        tests:
          - not_null
      - name: source_row
        description: "One-based CSV line number, including the header at line 1."
        tests:
          - not_null
      - name: source_hash
        description: "SHA-256 of the full CSV bytes at ingestion."
        tests:
          - not_null
      - name: loaded_at
        description: "Timezone-aware UTC ingestion timestamp."
        tests:
