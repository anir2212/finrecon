  - name: fct_reconciliation
    description: "One classified ledger/bank reference figure; excludes document and audit findings."
    columns:
      - name: figure_id
        description: "Stable reference-derived figure ID for source tracing."
        tests:
          - not_null
          - unique
      - name: reference
        description: "Payment reference used for exact reconciliation; may be absent from other feeds."
      - name: status
        description: "Deterministic reconciliation category."
      - name: difference_cents
        description: "Ledger cents minus bank cents; SGD in this fixture."
      - name: explanation
        description: "Rule-generated reason for the category."
      - name: ledger_ids
        description: "JSON array of source ledger IDs."
      - name: bank_ids
        description: "JSON array of source bank IDs."
      - name: recorded_at
