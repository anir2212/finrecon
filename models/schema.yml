version: 2
sources:
  - name: raw
    schema: raw
    description: 'Unmodified CSV strings with file and row metadata.'
    tables:
      - name: ledger
        description: "Grain: One general-ledger AP settlement posting per row. Excludes: Cash receipts, journal reversals, and non-SGD postings."
        columns:
          - name: id
            description: "Unique row identifier within this source feed."
          - name: reference
            description: "Payment reference used for exact reconciliation; may be absent from other feeds."
          - name: posted_on
            description: "Date recorded by this source, without an intra-day time."
          - name: posted_at
            description: "Timezone-aware posting instant; generated fixture uses Asia/Singapore time."
          - name: counterparty
            description: "Source spelling of the vendor or payment counterparty."
          - name: currency
            description: "ISO currency code; this fixture supports SGD only."
          - name: amount_cents
            description: "Signed integer amount in the currency's minor units."
          - name: account
            description: "GL account code; usually AP-SETTLEMENT with one SUSPENSE anomaly."
          - name: contra_account
            description: "Counter-account; paired with account for journal anomaly features."
          - name: created_by
            description: "User who recorded the posting."
          - name: approved_by
            description: "User who approved the posting."
      - name: bank
        description: "Grain: One bank statement movement per row; a payment can have multiple rows. Excludes: Intraday balances and bank fees in separate statement lines."
        columns:
          - name: id
            description: "Unique row identifier within this source feed."
          - name: reference
            description: "Payment reference used for exact reconciliation; may be absent from other feeds."
          - name: posted_on
            description: "Date recorded by this source, without an intra-day time."
          - name: counterparty
            description: "Source spelling of the vendor or payment counterparty."
          - name: currency
            description: "ISO currency code; this fixture supports SGD only."
          - name: amount_cents
            description: "Signed integer amount in the currency's minor units."
      - name: processor
        description: "Grain: One processor settlement record per row. Excludes: Chargebacks and reserve holds."
        columns:
          - name: id
            description: "Unique row identifier within this source feed."
          - name: reference
            description: "Payment reference used for exact reconciliation; may be absent from other feeds."
          - name: settled_on
            description: "Processor settlement date."
          - name: currency
            description: "ISO currency code; this fixture supports SGD only."
          - name: gross_cents
            description: "Gross settlement before processor fee."
          - name: fee_cents
            description: "Processor fee; nonnegative integer cents."
          - name: net_cents
            description: "Gross less fee; nonnegative integer cents."
      - name: exchange
        description: "Grain: One synthetic exchange transfer per row. Excludes: Market prices, network confirmations, and on-chain verification."
        columns:
          - name: id
            description: "Unique row identifier within this source feed."
          - name: tx_hash
            description: "Synthetic transaction hash; not verified on-chain."
          - name: posted_on
            description: "Date recorded by this source, without an intra-day time."
          - name: direction
            description: "Transfer direction relative to the exchange account."
          - name: currency
            description: "ISO currency code; this fixture supports SGD only."
          - name: amount_cents
            description: "Signed integer amount in the currency's minor units."
      - name: invoices
        description: "Grain: One accounts-payable invoice per row. Excludes: Credit notes, partial invoices, and tax line items."
        columns:
          - name: id
            description: "Unique row identifier within this source feed."
          - name: po_id
            description: "Referenced purchase-order ID."
          - name: vendor
            description: "Vendor name recorded on the invoice."
          - name: invoice_on
            description: "Invoice issue date."
          - name: currency
            description: "ISO currency code; this fixture supports SGD only."
          - name: amount_cents
            description: "Signed integer amount in the currency's minor units."
          - name: created_by
            description: "User who entered the invoice."
      - name: purchase_orders
        description: "Grain: One approved purchase order per row. Excludes: PO amendments, line-level budgets, and approval history."
        columns:
          - name: id
            description: "Unique row identifier within this source feed."
          - name: vendor
            description: "Vendor named on the order."
          - name: approved_on
            description: "Date the order was approved."
          - name: currency
            description: "ISO currency code; this fixture supports SGD only."
          - name: cap_cents
            description: "Maximum approved amount in cents."
          - name: approved_by
            description: "Approver's user ID."
